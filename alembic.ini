# Migraciones de la base PostgreSQL (pase a Postgres, ver PLAN_POSTGRES.md).
# La URL sale de la variable DATABASE_URL (o del .env): nunca va escrita acá.
#   alembic upgrade head      aplica lo que falte
#   alembic current           muestra en qué migración está la base
[alembic]
script_location = %(here)s/migraciones
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
