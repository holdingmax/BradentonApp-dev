{% extends "base.html" %}
{% block content %}
<div class="page-header">
  <h1>Carga de Datos</h1>
  <p class="page-subtitle">Subí un PDF o un extracto y queda guardado solo, organizado y categorizado — sin generar ni abrir ningún Excel.</p>
</div>
<div class="tool-grid">
  {% for tool in tools %}
    <a class="tool-card" href="{{ tool.url }}" style="--tool-accent: {{ tool.accent }};">
      <span class="tool-card-badge">{{ tool.icon|safe }}</span>
      <span class="tool-card-body">
        <span class="tool-card-label">{{ tool.label }}</span>
        <span class="tool-card-desc">{{ tool.description }}</span>
      </span>
    </a>
  {% endfor %}
</div>
{% endblock %}
