{% extends "base.html" %}
{% block title %}Cambiar contraseña — Bradenton App{% endblock %}
{% block crumbs %}
<nav class="crumbs"><span class="current">Cambiar contraseña</span></nav>
{% endblock %}
{% block content %}
<div class="page-header">
  <span class="eyebrow">Mi cuenta</span>
  <h1>Cambiar contraseña</h1>
  <p class="page-subtitle">Actualizá la contraseña de tu propia cuenta ({{ current_user.id }}).</p>
</div>
<div class="card">
  <form method="post">
    <label class="muted">Contraseña actual</label>
    <input type="password" name="current_password" required>
    <label class="muted">Contraseña nueva</label>
    <input type="password" name="new_password" required>
    <label class="muted">Confirmar contraseña nueva</label>
    <input type="password" name="confirm_password" required>
    <button type="submit">Actualizar contraseña</button>
  </form>
</div>
{% endblock %}
